; ============================================================
;  ROBOT TREPADOR - ESP32 del robot (receptor) - micro-ROS
; ============================================================
;  Compilar y subir:   pio run -t upload
;  Monitor de depuración: pio device monitor
;
;  IMPORTANTE: board_microros_distro debe ser la MISMA distro de
;  ROS 2 que tienes en el PC (humble, jazzy, kilted...).
;  Si la cambias, ejecuta antes:  pio run -t clean_microros
; ============================================================

[env:robot]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_microros_distro = jazzy
board_microros_transport = custom

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

build_flags =
    -DCORE_DEBUG_LEVEL=0
