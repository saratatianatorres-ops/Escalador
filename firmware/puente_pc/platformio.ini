; ============================================================
;  ROBOT TREPADOR - ESP32 puente (conectada al PC por USB)
; ============================================================
;  Solo copia bytes entre el USB y ESP-NOW. No necesita micro-ROS:
;  el agente micro-ROS corre en el PC.
;
;  Subir:  pio run -t upload
;  NO abras el monitor serie mientras corre el agente: ambos usan el
;  mismo puerto.
; ============================================================

[env:puente]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
