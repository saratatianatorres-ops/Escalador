# Puente ROS 2 <-> Gazebo (ros_gz_bridge)
# Los tópicos /robot/... son los mismos que usa el robot real, así la interfaz no cambia.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# ---- Sensores y pose (Gazebo -> ROS) ----
- ros_topic_name: /robot/imu
  gz_topic_name: /robot/imu_gz
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /robot/odom
  gz_topic_name: /model/escalador/odometria
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name: /model/escalador/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /model/escalador/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# ---- Actuadores (ROS -> Gazebo), los manda firmware_simulado ----
- ros_topic_name: /sim/cmd_vel
  gz_topic_name: /model/escalador/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /sim/empuje_delantero
  gz_topic_name: /escalador/empuje_delantero
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /sim/empuje_trasero
  gz_topic_name: /escalador/empuje_trasero
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
